interface:
  display_name: "Analysis CAD MCP"
  short_description: "CAD assembly workflows, clash markers, and issue descriptions"
  default_prompt: "Use $analysis-cad-mcp to inspect the requested drawing, review component or pipe interference and clearance, and annotate supplied or verified clash locations with numbered markers, explanatory leaders, and a per-point report."

dependencies:
  tools:
    - type: "mcp"
      value: "best-cad-mcp"
      description: "AutoCAD MCP server with CAD-IR, semantic graph, dimension binding, constraints, validation, VLM overlay/pixel grounding, CADPlan variables/dry-run/execution, drawing, query, model-private annotation, BOM/table, block, dimension, hatch, layout, and export tools."

policy:
  allow_implicit_invocation: true
